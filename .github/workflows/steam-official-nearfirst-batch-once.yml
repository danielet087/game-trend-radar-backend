name: Experiment - Steam official Followers nearest release small batch

on:
  push:
    branches: [main]
    paths:
      # Explicit external batch handoff only; checkpoint commits do not retrigger.
      - experiments/steam_official_nearfirst_20260922/manual_batch_trigger.txt
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: isolated-official-nearfirst-frozen-20260922
  cancel-in-progress: false

jobs:
  small-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout only isolated script and checkpoint
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/experiment_official_near_release_batches.py
            experiments/steam_official_nearfirst_20260922/
          sparse-checkout-cone-mode: false

      - name: Freeze original 1317-app queue for all future batches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p experiments/steam_official_nearfirst_20260922
          TARGET="experiments/steam_official_nearfirst_20260922"
          if [ -s "$TARGET/source_queue.json" ] && [ -s "$TARGET/source_unresolved.json" ]; then
            echo "Reusing existing durable frozen cohort."
          else
            mkdir -p input/queue input/prefilter
            gh run download 35811490947 --repo "${GITHUB_REPOSITORY}" --name steam-followers-priority-queues-20260922 --dir input/queue
            gh run download 35702182234 --repo "${GITHUB_REPOSITORY}" --name steam-followers-prefilter-fresh --dir input/prefilter
            cp input/queue/first_source_missing_both_unmeasured.json "$TARGET/source_queue.json"
            cp input/prefilter/third_party_unresolved.json "$TARGET/source_unresolved.json"
          fi
          python - <<'PY'
          import json
          root="experiments/steam_official_nearfirst_20260922/"
          a=json.load(open(root+"source_queue.json",encoding="utf-8"))
          b=json.load(open(root+"source_unresolved.json",encoding="utf-8"))
          assert len(a)==1317 and len(b)==1358,(len(a),len(b))
          assert len({int(x["appid"]) for x in a})==1317
          assert all(x["release_date"] and len(x["release_date"])==10 for x in a)
          print("OFFICIAL_NEARFIRST_FROZEN_INPUT_OK",len(a),"earliest",min(x["release_date"] for x in a))
          PY

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency and validate script
        run: |
          python -m pip install --disable-pip-version-check requests
          python -m py_compile scripts/experiment_official_near_release_batches.py

      - name: Official XML at most three games nearest Taiwan release date
        run: >
          python -u scripts/experiment_official_near_release_batches.py
          --checkpoint experiments/steam_official_nearfirst_20260922/checkpoint.json
          --output output/steam_official_nearfirst
          --max-requests 3
          --interval 28
          --max-seconds 190

      - name: Preserve independent official outcome or 429 cooldown checkpoint
        if: always()
        run: |
          if [ -s experiments/steam_official_nearfirst_20260922/checkpoint.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add experiments/steam_official_nearfirst_20260922/checkpoint.json experiments/steam_official_nearfirst_20260922/source_queue.json experiments/steam_official_nearfirst_20260922/source_unresolved.json
            if ! git diff --cached --quiet; then
              git commit -m "experiment: checkpoint near-release Steam official Followers small batch"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi

      - name: Auto-disable schedule when entire frozen cohort is complete
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os
          p="experiments/steam_official_nearfirst_20260922/checkpoint.json"
          d=json.load(open(p,encoding="utf-8"))
          assert len(d["official_results"])<=1317
          print("Frozen queue official results:",len(d["official_results"]),"/1317")
          PY
          if [ "$(python -c 'import json; d=json.load(open("experiments/steam_official_nearfirst_20260922/checkpoint.json")); print("true" if len(d["official_results"])==1317 else "false")')" = "true" ]; then
            echo "All 1317 official records complete; disable recurring workflow."
            gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/steam-official-nearfirst-batch-once.yml/disable"
          fi

      - name: Publish a result summary for EVERY run
        if: always()
        run: |
          if [ -s output/steam_official_nearfirst/report.json ]; then
            python - <<'PY'
          import json,os
          r=json.load(open("output/steam_official_nearfirst/report.json",encoding="utf-8"))
          rows=[
            "## Steam official Followers — nearest release batch",
            "",
            f"- Status: **{r['status']}**",
            f"- Total official results: **{r['completed']} / {r['total']}**",
            f"- Requests this run: **{r['requests_this_run']}**",
            f"- Verified >=5,000: **{r['official_ge5000']}**",
            f"- Verified below 5,000: **{r['official_below5000']}**",
            f"- Still pending: **{r['pending']}**",
            f"- Pending today: **{r['pending_today']}**",
            f"- Pending within next 7 days: **{r['pending_next_7_days']}**",
            f"- Next allowed request after: **{r.get('next_request_after_taipei') or 'now'}**",
            "",
            "No production Steam sync/cache/frontend was changed."
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as f:
            f.write("\\n".join(rows)+"\\n")
          print("OFFICIAL_NEARFIRST_STEP_SUMMARY_WRITTEN",flush=True)
          PY
          else
            echo "No output report generated." >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload next date-ordered queue and official Followers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: steam-official-nearfirst-small-batch
          path: output/steam_official_nearfirst/
          if-no-files-found: warn
          retention-days: 30
