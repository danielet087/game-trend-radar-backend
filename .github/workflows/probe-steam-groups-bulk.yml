name: Probe Steam groups third-party bulk (read-only)

# Paused by request: automatic workflow triggers disabled.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    # One-off short probe, independent of the missing self-hosted runner.
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout private backend read-only
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install HTTP client
        run: python -m pip install --disable-pip-version-check requests
      - name: Probe third-party group bulk API on 12 verified public group IDs
        run: python -m scripts.probe_steam_groups_bulk
      - name: Check generated JSON
        if: always()
        run: |
          if [ -f output/steam_groups_bulk_probe.json ]; then
            python -m json.tool output/steam_groups_bulk_probe.json > /dev/null
          fi
      - name: Archive private experiment report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: steam-groups-bulk-probe
          path: output/steam_groups_bulk_probe.json
          if-no-files-found: ignore
          retention-days: 1
