name: Release unreferenced database evidence
run-name: "Evidence retention | ${{ (github.event_name == 'schedule' || inputs.apply) && 'apply' || 'dry-run' }} | grace=${{ inputs.grace_days || 3 }}d"

# Each hourly Steam intake pins the frontend snapshot it reads. Pins that no
# current document references only keep old bytes in Turso and D1. The daily
# schedule releases them after the grace window, at most 200 per run; a manual
# run only reports unless apply is chosen. The hourly storage sync
# garbage-collects the released bytes on both databases.
on:
  schedule:
    - cron: '37 20 * * *'  # 04:37 Asia/Taipei
  workflow_dispatch:
    inputs:
      apply:
        description: "Release unreferenced pins older than the grace window (default: report only)"
        required: false
        type: boolean
        default: false
      grace_days:
        description: "Always keep pins captured within this many days"
        required: false
        type: number
        default: 3

permissions:
  contents: read

concurrency:
  group: radar-evidence-retention
  cancel-in-progress: false

jobs:
  retention:
    if: vars.RADAR_DATABASE_MIGRATION_PAUSE != '1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify retention rules without credentials
        run: |
          python -m pip install --disable-pip-version-check ./packages/radar-core 'pytest>=8,<9' 'requests>=2.32,<3'
          python -m pytest -q tests/test_storage_evidence_retention.py
      - name: Plan or release unreferenced evidence
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          APPLY: ${{ github.event_name == 'schedule' || inputs.apply }}
          GRACE_DAYS: ${{ inputs.grace_days || 3 }}
          MAX_RELEASE: ${{ github.event_name == 'schedule' && '200' || '' }}
        run: |
          args=(--grace-days "$GRACE_DAYS" --report-path "$RUNNER_TEMP/evidence-retention.json")
          if [ "$APPLY" = "true" ]; then args+=(--apply); fi
          if [ -n "$MAX_RELEASE" ]; then args+=(--max-release "$MAX_RELEASE"); fi
          python -u -m scripts.storage_evidence_retention "${args[@]}"
      - name: Keep the retention report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-retention-report
          path: ${{ runner.temp }}/evidence-retention.json
          if-no-files-found: warn
          retention-days: 30
