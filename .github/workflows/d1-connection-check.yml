name: Verify Cloudflare D1 database connection

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/d1-connection-check.yml
      - scripts/check_d1_connection.py
      - tests/test_d1_connection.py

permissions:
  contents: read

concurrency:
  group: d1-connection-check
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify diagnostic safeguards without credentials
        run: python -m unittest tests.test_d1_connection -v
      - name: Verify D1 read, write and cleanup
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: python -m scripts.check_d1_connection --report-path "$RUNNER_TEMP/d1-connection-report.json"
      - name: Preserve credential-free diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d1-connection-report
          path: ${{ runner.temp }}/d1-connection-report.json
          if-no-files-found: warn
          retention-days: 7
