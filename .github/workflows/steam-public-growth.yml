name: Track accepted game growth through release plus 30 days
run-name: "Steam public growth | slot=${{ inputs.target_slot || 'manual' }} | source=${{ inputs.trigger_source || github.event_name }}"

on:
  workflow_dispatch:
    inputs:
      trigger_source:
        description: Trigger origin; Cloudflare requires a daily UTC target_slot
        required: false
        default: manual
        type: choice
        options: [manual, cloudflare]
      target_slot:
        description: Original Taiwan 01:15/07:15/13:15/19:15 check as an ISO UTC timestamp
        required: false
        default: ""
        type: string
  push:
    branches: [main]
    paths: ['.github/steam-growth-trigger.txt']

permissions:
  contents: write

# Share the existing official-Followers lock; never run the two XML collectors together.
concurrency:
  group: isolated-official-nearfirst-frozen-20260922
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    # 150 minutes collection budget, including bounded cooldown waiting, plus
    # setup and acknowledged checkpoint/publication delivery.
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install collection and shared contract dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Validate external growth slot before collecting measurements
        id: schedule_guard
        env:
          SCHEDULE_EVENT: ${{ github.event_name }}
          SCHEDULE_TRIGGER_SOURCE: ${{ inputs.trigger_source }}
          SCHEDULE_TARGET_SLOT: ${{ inputs.target_slot }}
        run: python -m scripts.external_schedule --workflow public-growth --fail-on-skip
      - name: Validate boundary and throttling behavior
        run: |
          python -m unittest discover -s tests -p test_public_growth.py
          python -m unittest discover -s tests -p test_external_schedule.py
      - name: Read the published catalog
        id: catalog
        run: |
          git clone --depth 1 https://github.com/danielet087/game-trend-radar.git frontend
          echo "revision=$(git -C frontend rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Refresh growth state after acquiring the shared lock
        id: growth_state
        run: |
          set -euo pipefail
          code_revision=$(git rev-parse HEAD)
          git fetch --no-tags origin main:refs/remotes/origin/main
          state_revision=$(git rev-parse refs/remotes/origin/main)
          state_paths=(
            experiments/steam_official_daily_catchup/checkpoint.json
            experiments/steam_official_nearfirst_20260922/checkpoint.json
            experiments/steam_official_followers_20260922/checkpoint.json
            data/steam_followers_cache.json
            data/steam_prefilter_state.json
          )
          for state_path in "${state_paths[@]}"; do
            git cat-file -e "$state_revision:$state_path"
          done
          # The checkpoint publisher owns only the primary checkpoint. Freeze
          # auxiliary inputs outside tracked paths so its scope guard remains strict.
          mkdir -p output/growth-inputs
          git show "$state_revision:data/steam_followers_cache.json" > output/growth-inputs/official-cache.json
          git show "$state_revision:experiments/steam_official_nearfirst_20260922/checkpoint.json" > output/growth-inputs/legacy-checkpoint.json
          git show "$state_revision:data/steam_prefilter_state.json" > output/growth-inputs/group-state.json
          git show "$state_revision:experiments/steam_official_followers_20260922/checkpoint.json" > output/growth-inputs/original-checkpoint.json
          git restore --source="$state_revision" --worktree -- experiments/steam_official_daily_catchup/checkpoint.json
          echo "revision=$state_revision" >> "$GITHUB_OUTPUT"
          echo "GROWTH_STATE_INPUT code=$code_revision state=$state_revision"
      - name: Collect dated official measurements
        id: collect
        env:
          STEAM_WEB_API_KEY: ${{ secrets.STEAM_WEB_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p output
          cp experiments/steam_official_daily_catchup/checkpoint.json output/growth-checkpoint-baseline.json
          python -m scripts.collect_public_growth --data-dir frontend/data --output output/public-growth.json \
            --interval 30 --max-requests 250 --max-seconds 9000 \
            --wait-for-cooldown --max-cooldown-wait 3600 \
            --official-cache output/growth-inputs/official-cache.json \
            --legacy-checkpoint output/growth-inputs/legacy-checkpoint.json \
            --group-state output/growth-inputs/group-state.json \
            --original-checkpoint output/growth-inputs/original-checkpoint.json
      - name: Persist official observations and cooldown against the latest queue
        id: checkpoint
        if: always() && !cancelled() && steps.collect.outcome != 'skipped'
        run: |
          python -m radar_backend.jobs.publish_steam growth-checkpoint \
            --receipt output/steam-growth-checkpoint-publication.json
      - name: Publish against the latest accepted catalog
        id: publish
        if: always() && !cancelled() && steps.checkpoint.outputs.state_persisted == 'true'
        env:
          FRONTEND_REPO_TOKEN: ${{ secrets.FRONTEND_REPO_TOKEN }}
        run: |
          python -m radar_backend.jobs.publish_steam growth \
            --input-revision "${{ steps.catalog.outputs.revision }}" \
            --receipt output/steam-growth-publication.json
      - name: Record durable state and publication acknowledgements
        if: always() && !cancelled()
        env:
          STATE_PERSISTED: ${{ steps.checkpoint.outputs.state_persisted || 'false' }}
          PUBLISHED: ${{ steps.publish.outputs.published || 'false' }}
          TARGET_SLOT: ${{ inputs.target_slot }}
          INPUT_REVISION: ${{ steps.catalog.outputs.revision }}
        run: |
          python -m scripts.persist_growth_checkpoint stamp --report output/public-growth.json \
            --state-persisted "$STATE_PERSISTED" --published "$PUBLISHED" \
            --target-slot "$TARGET_SLOT" --input-revision "$INPUT_REVISION"
      - name: Require complete growth coverage
        if: always() && !cancelled()
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          import json
          from pathlib import Path
          from scripts.external_schedule import growth_collection_complete

          path = Path("output/public-growth.json")
          result = json.loads(path.read_text(encoding="utf-8")) if path.is_file() else {}
          if not growth_collection_complete(result, datetime.now(timezone.utc)):
              job = result.get("job_result", {})
              raise SystemExit(
                  "Daily growth coverage incomplete; saved partial progress remains available for the next six-hour check; "
                  f"reason={job.get('reason', result.get('reason', 'missing_collection_result'))}; "
                  f"measured={len(result.get('measurements', []))}; "
                  f"unavailable={len(result.get('unavailable', []))}; "
                  f"retryable={len(result.get('pending', []))}; eligible={result.get('eligible', 'unknown')}"
              )
          print("DAILY_STEAM_GROWTH_COMPLETE", result["eligible"],
                f"measured={len(result['measurements'])}",
                f"unavailable={len(result.get('unavailable', []))}")
          PY
      - name: Report measured coverage
        if: always()
        run: |
          if [ -f output/public-growth.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open('output/public-growth.json'))
          coverage=d.get('coverage', {})
          print('### Steam 成長追蹤')
          print(f"實際量測／重用：{len(d.get('measurements', []))} 筆")
          print(f"符合追蹤資格：{coverage.get('eligible', d.get('eligible', 'unknown'))} 款；官方確認目前無 GroupID：{coverage.get('unavailable', len(d.get('unavailable', [])))} 款；仍待重試：{coverage.get('pending', len(d.get('pending', [])))} 款")
          print(f"本次請求：{d.get('requests', 'interrupted')}；結束原因：{d.get('reason', 'interrupted')}")
          print(f"官方 GroupID 解析請求：{d.get('group_resolution_requests', 0)}；全部取得 Followers 量測：{d.get('measurement_complete', d.get('collection_complete', False))}")
          job = d.get('job_result', {})
          print(f"工作狀態：{job.get('status', 'failed')}；狀態已保存：{job.get('state_persisted', False)}；發布完成：{job.get('published', False)}")
          for item in d.get('unavailable', []):
              print(f"- AppID {item['appid']}：官方確認目前無 GroupID；保留既有 Followers，未產生新量測。")
          for item in d.get('pending', []):
              print(f"- AppID {item['appid']}：待重試（{item.get('reason', 'unknown')}）。")
          print('僅追蹤本站合格遊戲，至上市後第 30 天；缺值不補成 0。')
          PY
          fi
      - name: Keep the collection and delivery report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: steam-public-growth-result
          path: |
            output/public-growth.json
            output/steam-growth-checkpoint-publication.json
            output/steam-growth-publication.json
          if-no-files-found: ignore
          retention-days: 7
