name: Test content backend cross-repo qualified once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/test-content-backend-crossrepo-qualified-once.yml

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send one already verified qualified game to dedicated content backend
        env:
          GH_TOKEN: ${{ secrets.CONTENT_BACKEND_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::CONTENT_BACKEND_TOKEN is missing"
            exit 1
          fi
          gh api --method POST \
            repos/danielet087/game-trend-radar-content-backend/dispatches \
            -f event_type=steam_game_refresh \
            -F 'client_payload[appid]=2087540' \
            -F 'client_payload[official_followers]=6613' \
            -f 'client_payload[release_date]=2026-10-21' \
            -f 'client_payload[official_checked_at_taipei]=2026-09-23T14:43:20.202290+08:00' \
            -f 'client_payload[source_repository]=danielet087/game-trend-radar-backend'
          echo "CROSS_REPO_QUALIFIED_DISPATCH_SENT AppID=2087540"

# retry after dedicated content backend secret wiring fix
