name: Experiment - probe second follower source on unresolved Steam candidates

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/steam-second-follower-source-probe-once.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: isolated-second-follower-source-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout probe script only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/experiment_second_follower_source_probe.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download fresh prefilter artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf input
          mkdir -p input
          gh run download 35702182234             --repo "${GITHUB_REPOSITORY}"             --name steam-followers-prefilter-fresh             --dir input
          test -s input/third_party_unresolved.json
          test -s input/third_party_4000_priority.json
          test -s input/third_party_below_4000.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Probe anonymous second follower source
        run: >
          python -u scripts/experiment_second_follower_source_probe.py
          --unresolved input/third_party_unresolved.json
          --priority input/third_party_4000_priority.json
          --below input/third_party_below_4000.json
          --out output/second_source_probe

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: steam-second-follower-source-probe
          path: output/second_source_probe/
          if-no-files-found: warn
          retention-days: 7
