name: Steam official Followers - GitHub hourly auto 250

# GitHub-only scheduler; no ChatGPT/marker-based triggers.
# Taiwan 06:00..23:00 hourly; GitHub can delay schedule start.
on:
  schedule:
    - cron: "0 6-23 * * *"
      timezone: "Asia/Taipei"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: isolated-official-nearfirst-frozen-20260922
  cancel-in-progress: false

jobs:
  follower-catchup:
    runs-on: ubuntu-latest
    timeout-minutes: 62
    steps:
      - name: Checkout only necessary sources (read production status, write isolated official outcomes)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/experiment_official_daily_catchup_250.py
            experiments/steam_official_nearfirst_20260922/
            experiments/steam_official_followers_20260922/checkpoint.json
            experiments/steam_official_daily_catchup/
            data/steam_candidates_eligible.json
            data/steam_prefilter_state.json
            data/steam_followers_cache.json
          sparse-checkout-cone-mode: false

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency and validate syntax
        run: |
          python -m pip install --disable-pip-version-check requests
          python -m py_compile scripts/experiment_official_daily_catchup_250.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("experiments/steam_official_nearfirst_20260922")
          assert len(json.loads((root/"source_queue.json").read_text(encoding="utf-8")))==1317
          d=json.loads((root/"checkpoint.json").read_text(encoding="utf-8"))
          assert d["cohort"]=="steam_fresh_20260922_post_adult_1317_near_release"
          print("CATCHUP_INPUT_OK original_cohort=1317 confirmed="+str(len(d["official_results"])))
          PY

      - name: Check Taiwan execution window (exclude delayed schedules outside 06–23)
        id: window
        env:
          EVENT: ${{ github.event_name }}
        run: |
          HOUR="$(TZ=Asia/Taipei date +%H)"
          if [ "$EVENT" = "workflow_dispatch" ] || { [ "$HOUR" -ge 6 ] && [ "$HOUR" -le 23 ]; }; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "Scheduled run delayed to Taiwan hour $HOUR outside 06–23; no Steam requests." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fetch up to 250 NEW official counts in date order with >=8s pacing
        if: steps.window.outputs.proceed == 'true'
        run: >
          python -u scripts/experiment_official_daily_catchup_250.py
          --max-requests 250
          --interval 8
          --max-seconds 3450
          --save-every 10

      - name: Final checkpoint save, including error and cooldown
        if: always()
        run: |
          if [ -s experiments/steam_official_daily_catchup/checkpoint.json ]; then
            git add experiments/steam_official_daily_catchup/checkpoint.json
            if ! git diff --cached --quiet; then
              git commit -m "experiment: save dynamic official Followers batch"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi

      - name: Publish actual per-batch result summary
        if: always()
        run: |
          if [ -s output/steam_official_daily_catchup/report.json ]; then
            python - <<'PY'
          import json,os
          r=json.load(open("output/steam_official_daily_catchup/report.json",encoding="utf-8"))
          lines=[
            "## Steam 官方 Followers 動態補漏",
            f"- 本輪結果：**{r['stop_reason']}**",
            f"- 本輪官方成功：**{r['official_new_this_run']} / {r['request_limit']}**",
            f"- 本輪請求：**{r['requests_this_run']}**；429：**{r['http_429_this_run']}**",
            f"- 累計官方完成：**{r['combined_official_completed']}**",
            f"- 目前待查：**{r['remaining_queue']}**",
            f"- 當日新來源狀態：**{r['source_status']['status']}**",
            f"- 今日新加入：**{r['source_status']['added_from_daily']}**",
            f"- 冷卻到：**{r.get('next_request_after_taipei') or '無'}**",
            f"- 實際耗時：**{r['elapsed_seconds']}秒**",
            "只更新獨立官方查詢 Checkpoint，不修改正式網站和 Followers Cache。",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as f:
            f.write("\n".join(lines)+"\n")
          PY
          else
            echo "Batch exited without result report; check logs." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload attempt details and observed batch report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: steam-official-dynamic-catchup-250
          path: output/steam_official_daily_catchup/
          if-no-files-found: warn
          retention-days: 30
