name: Publish Steam calendar preview

# Paused by request: no automatic schedule, push, or workflow_run triggers.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: steam-calendar-preview
  cancel-in-progress: false

jobs:
  publish:
    # Preview may fetch Followers; run in a GitHub-hosted ephemeral VM.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout backend
        uses: actions/checkout@v4

      - name: Use latest committed private launch history
        run: git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Verify localized titles and recent-launch follower thresholds
        run: python -m pytest -q tests/test_steam_preview_locale.py tests/test_steam_recent_launch.py

      - name: Read persisted checkpoint (no Followers queries)
        run: |
          git fetch --no-tags --depth=1 origin steam-state
          git show FETCH_HEAD:data/steam_followers_checkpoint.json > /tmp/steam_followers_checkpoint.json
          python -m json.tool /tmp/steam_followers_checkpoint.json > /dev/null

      - name: Build public Steam calendar preview
        run: >
          python -m scripts.publish_steam_preview
          --checkpoint /tmp/steam_followers_checkpoint.json
          --output output/steam_preview.json
          --recent-state data/steam_recent_launch_state.json
          --min-followers 5000
          --max-new-followers 45
          --follower-interval 30

      - name: Validate preview JSON
        run: python -m json.tool output/steam_preview.json > /dev/null

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: steam-preview-json
          path: output/steam_preview.json
          if-no-files-found: error
          retention-days: 7

      - name: Persist private recent-launch follower history
        run: |
          python -m json.tool data/steam_recent_launch_state.json > /dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/steam_recent_launch_state.json
          if git diff --cached --quiet; then
            echo "Recent launch history unchanged."
          else
            git commit -m "data: save verified newly released Steam games"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Publish preview to public frontend
        env:
          FRONTEND_REPO_TOKEN: ${{ secrets.FRONTEND_REPO_TOKEN }}
        run: |
          if [ -z "$FRONTEND_REPO_TOKEN" ]; then
            echo "::error::FRONTEND_REPO_TOKEN is missing; cannot publish preview."
            exit 1
          fi
          git clone --depth 1 https://github.com/danielet087/game-trend-radar.git frontend
          mkdir -p frontend/data
          cp output/steam_preview.json frontend/data/steam_preview.json
          cd frontend
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/steam_preview.json
          if git diff --cached --quiet; then
            echo "Steam preview is unchanged."
            exit 0
          fi
          git commit -m "data: refresh Steam calendar preview"
          git remote set-url origin "https://x-access-token:${FRONTEND_REPO_TOKEN}@github.com/danielet087/game-trend-radar.git"
          git push origin main
