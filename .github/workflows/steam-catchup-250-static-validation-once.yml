name: Experiment - validate dynamic 250 Followers queue without Steam queries
# Regression preflight after enforcing same-Taiwan-day eligible + prefilter sources.

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/steam-catchup-250-static-validation-once.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/workflows/steam-official-daily-catchup-250.yml
            .github/workflows/steam-content-enrichment-dispatch.yml
            scripts/experiment_official_daily_catchup_250.py
            content_backend/
            experiments/steam_official_nearfirst_20260922/
            experiments/steam_official_followers_20260922/checkpoint.json
            experiments/steam_official_daily_catchup/checkpoint.json
            data/steam_candidates_eligible.json
            data/steam_prefilter_state.json
            data/steam_followers_cache.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Python syntax and real source-to-queue assembly WITHOUT Steam HTTP
        run: |
          python -m pip install --disable-pip-version-check requests pyyaml opencc-python-reimplemented
          python -m py_compile scripts/experiment_official_daily_catchup_250.py content_backend/enrich_game.py
          PYTHONPATH=content_backend python -m unittest -q content_backend/test_enrich_game.py
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.experiment_official_daily_catchup_250 import make_queue,group_to_gid,valid_date
          root=Path("experiments/steam_official_nearfirst_20260922")
          cp={"pending_candidates":{},"official_results":{}}
          rows=json.loads((root/"source_queue.json").read_text(encoding="utf-8"))
          old=json.loads((root/"checkpoint.json").read_text(encoding="utf-8"))
          groups=json.loads((root/"source_unresolved.json").read_text(encoding="utf-8"))
          catalog=json.loads(Path("data/steam_candidates_eligible.json").read_text(encoding="utf-8"))
          pre=json.loads(Path("data/steam_prefilter_state.json").read_text(encoding="utf-8"))
          cache=json.loads(Path("data/steam_followers_cache.json").read_text(encoding="utf-8"))
          other=json.loads(Path("experiments/steam_official_followers_20260922/checkpoint.json").read_text(encoding="utf-8"))
          q,source=make_queue(cp,rows,old,groups,catalog,pre,cache,other)
          assert len(cp["pending_candidates"])==1317

          # Regression: AppID 4435490 has no group ID and its fallback endpoint
          # returned HTML. It stays parked while every actually queryable row
          # must have a real group ID. The queue length is intentionally dynamic.
          real_cp=json.loads(Path("experiments/steam_official_daily_catchup/checkpoint.json").read_text(encoding="utf-8"))
          real_q,real_source=make_queue(real_cp,rows,old,groups,catalog,pre,cache,other)
          assert "4435490" in real_cp.get("unresolved_candidates", {}), real_cp.get("unresolved_candidates")
          assert all(str(x["appid"])!="4435490" for x in real_q)
          assert all(x.get("group_id64") for x in real_q), [x["appid"] for x in real_q if not x.get("group_id64")]
          print("MISSING_GROUP_HTML_REGRESSION_PASS",json.dumps({
              "parked":"4435490","remaining_queryable":len(real_q)
          },ensure_ascii=False))
          assert len(q)>0
          assert len({int(x["appid"]) for x in q})==len(q)
          assert all(valid_date(x["release_date"]) for x in q)
          assert all(str(x["appid"]) not in old["official_results"] for x in q)
          assert group_to_gid(None) is None and group_to_gid(45053554)=="103582791474574962"
          from yaml import load, BaseLoader
          config=load(Path(".github/workflows/steam-official-daily-catchup-250.yml").read_text(encoding="utf-8"),Loader=BaseLoader)
          events=config["on"]
          assert "push" not in events and "schedule" in events and "workflow_dispatch" in events
          assert events["schedule"]==[{"cron":"0 3-23 * * *","timezone":"Asia/Taipei"}],events["schedule"]
          assert config["concurrency"]["cancel-in-progress"]=="false"
          receiver=load(Path(".github/workflows/steam-content-enrichment-dispatch.yml").read_text(encoding="utf-8"),Loader=BaseLoader)
          receiver_events=receiver["on"]
          assert "repository_dispatch" in receiver_events
          assert "steam_game_qualified" in receiver_events["repository_dispatch"]["types"]
          print("CONTENT_BACKEND_EVENT_VALIDATION_PASS",receiver_events["repository_dispatch"])
          print("GITHUB_SELF_SCHEDULE_VALIDATION_PASS",events["schedule"])
          print("CATCHUP_STATIC_VALIDATION_PASS",
                json.dumps({"frozen":len(rows),"prior_verified":len(old["official_results"]),
                            "remaining_now":len(q),"source":source},ensure_ascii=False))
          PY
# 2026-09-23 regression trigger: verify single missing-group HTML fallback is parked before resuming one-off.
# 2026-09-23 validation trigger: 03-23 schedule plus event-driven content backend.
