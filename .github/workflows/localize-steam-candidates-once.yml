name: One-time official Steam TW names for eligible candidates

# A single authorized localization run; switch to manual-only after starting.
on:
  push:
    branches: [main]
    paths: [".github/workflows/localize-steam-candidates-once.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: steam-localize-eligible-candidates
  cancel-in-progress: false

jobs:
  localize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout saved and filtered candidate snapshot
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Store API client and tests
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Unit test real Steam title and original metadata preservation
        run: python -m pytest -q tests/test_steam_localized_titles.py
      - name: Localize 3137 existing exact-day nonsexual candidates
        run: python -m scripts.localize_steam_eligible_candidates_once --snapshot data/steam_candidates_eligible.json
      - name: Verify original 11467, old follower state and all eligibility data unchanged
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          path="data/steam_candidates_eligible.json"
          previous=json.loads(subprocess.check_output(["git","show","HEAD:"+path],text=True))
          current=json.loads(Path(path).read_text(encoding="utf-8"))
          safe={"name_en","name_zh_tw"}
          assert previous["count"]==current["count"]==3137
          assert previous["source_count"]==current["source_count"]==11467
          assert len(previous["games"])==len(current["games"])
          for a,b in zip(previous["games"],current["games"]):
              assert a["appid"]==b["appid"]
              assert {k:v for k,v in a.items() if k not in safe}=={
                  k:v for k,v in b.items() if k not in safe}
              assert b["name_en"]==(a.get("name_en") or a["name"]).strip()
          new_keys={"official_zh_tw_titles_checked_at",
                    "official_zh_tw_titles_provider",
                    "official_zh_tw_titles_summary"}
          assert {k:v for k,v in previous.items() if k!="games"}=={
              k:v for k,v in current.items() if k not in new_keys|{"games"}}
          total=current["official_zh_tw_titles_summary"]
          assert total["total"]==3137
          assert total["official_zh_tw"]+total["english_fallback"]==3137
          print("TW_NAME_DATA_VALIDATED",json.dumps(total,ensure_ascii=False),flush=True)
          PY
          git diff --exit-code -- data/steam_candidates.json data/steam_candidate_state.json data/steam_prefilter_state.json data/steam_followers_cache.json
      - name: Publish only derived eligible names
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/steam_candidates_eligible.json
          git commit -m "data: add Steam official TW titles to eligible candidates [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
