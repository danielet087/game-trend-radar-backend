name: Probe Steam bulk 205-title stress sample

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-steam-bulk-stress-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests
      - name: Read-only 205-title API mapping stress test
        env:
          STEAM_WEB_API_KEY: ${{ secrets.STEAM_WEB_API_KEY }}
          PROBE_SELECTION: "45 >=5000, 80 100..4999, 80 <100 (per bucket availability)"
        run: python -m scripts.probe_steam_bulk_stress_v2
      - name: Validate report
        if: always()
        run: |
          if [ -f output/steam_bulk_stress_probe.json ]; then
            python -m json.tool output/steam_bulk_stress_probe.json > /dev/null
          fi
      - name: Save short-lived private report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: steam-bulk-stress-probe
          path: output/steam_bulk_stress_probe.json
          if-no-files-found: ignore
          retention-days: 1
