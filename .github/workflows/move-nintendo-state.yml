name: Move IGDB ledger to its database source
run-name: "Move IGDB ledger | ${{ inputs.action }} | ${{ inputs.apply && 'apply' || 'dry run' }}"

# Moves data/nintendo_master.json (the IGDB candidate ledger) out of the
# frontend source into the database-only source
# danielet087/game-trend-radar-igdb-backend@nintendo-state. bootstrap copies it
# there; retire deletes the frontend copy after checking that the database-only
# copy, the frontend database copy and the frontend Git tip are identical;
# restore puts it back. Without apply each action only reports. Manual only.
on:
  workflow_dispatch:
    inputs:
      action:
        description: bootstrap, retire or restore
        required: true
        type: choice
        options: [bootstrap, retire, restore]
      apply:
        description: Make the change (otherwise only report)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: move-nintendo-state
  cancel-in-progress: false

jobs:
  move:
    if: vars.RADAR_DATABASE_MIGRATION_PAUSE != '1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify move rules without credentials
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python -m pytest -q tests/test_move_nintendo_state.py
      - name: Move the IGDB ledger
        env:
          RADAR_DATABASE_PRIMARY: ${{ vars.RADAR_DATABASE_PRIMARY || '0' }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          FRONTEND_REPO_TOKEN: ${{ secrets.FRONTEND_REPO_TOKEN }}
          ACTION: ${{ inputs.action }}
          APPLY: ${{ inputs.apply && 'true' || 'false' }}
        run: |
          args=("$ACTION")
          if [ "$APPLY" = true ]; then args+=(--apply); fi
          python -u -m scripts.move_nintendo_state "${args[@]}"
