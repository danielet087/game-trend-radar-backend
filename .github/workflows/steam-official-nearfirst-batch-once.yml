name: Experiment - Steam official Followers nearest release small batch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/steam-official-nearfirst-batch-once.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: isolated-official-nearfirst-frozen-20260922
  cancel-in-progress: false

jobs:
  small-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout only isolated script and checkpoint
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/experiment_official_near_release_batches.py
            experiments/steam_official_nearfirst_20260922/
          sparse-checkout-cone-mode: false

      - name: Download original frozen missing-followers and group mapping
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input/queue input/prefilter
          gh run download 35811490947 --repo "${GITHUB_REPOSITORY}" --name steam-followers-priority-queues-20260922 --dir input/queue
          gh run download 35702182234 --repo "${GITHUB_REPOSITORY}" --name steam-followers-prefilter-fresh --dir input/prefilter
          python - <<'PY'
          import json
          a=json.load(open("input/queue/first_source_missing_both_unmeasured.json",encoding="utf-8"))
          b=json.load(open("input/prefilter/third_party_unresolved.json",encoding="utf-8"))
          assert len(a)==1317 and len(b)==1358,(len(a),len(b))
          assert len({int(x["appid"]) for x in a})==1317
          assert all(x["release_date"] and len(x["release_date"])==10 for x in a)
          print("OFFICIAL_NEARFIRST_INPUT_OK",len(a),"earliest",min(x["release_date"] for x in a))
          PY

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency and validate script
        run: |
          python -m pip install --disable-pip-version-check requests
          python -m py_compile scripts/experiment_official_near_release_batches.py

      - name: Official XML at most three games nearest Taiwan release date
        run: >
          python -u scripts/experiment_official_near_release_batches.py
          --checkpoint experiments/steam_official_nearfirst_20260922/checkpoint.json
          --output output/steam_official_nearfirst
          --max-requests 3
          --interval 28
          --max-seconds 190

      - name: Preserve independent official outcome or 429 cooldown checkpoint
        if: always()
        run: |
          if [ -s experiments/steam_official_nearfirst_20260922/checkpoint.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add experiments/steam_official_nearfirst_20260922/checkpoint.json
            if ! git diff --cached --quiet; then
              git commit -m "experiment: checkpoint near-release Steam official Followers small batch"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi

      - name: Upload next date-ordered queue and official Followers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: steam-official-nearfirst-small-batch
          path: output/steam_official_nearfirst/
          if-no-files-found: warn
          retention-days: 30
