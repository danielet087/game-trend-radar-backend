name: Update Steam upcoming data

# Legacy two-month initializer is retained for manual recovery only.
# ChatGPT marker and daily cron now belong to the two-stage workflow.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: steam-upcoming-daily
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout backend
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      # Exact release dates only; month/quarter/year/TBA dates are skipped.
      - name: Collect next 50 new Steam follower records (resume current segment)
        env:
          STEAM_CHECKPOINT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          python -m scripts.update_steam_daily
          --country TW
          --days 365
          --min-followers 5000
          --request-interval 30
          --search-interval 10
          --max-pages 100
          --segment-months 2
          --total-segments 6
          --follower-cache data/steam_followers_cache.json
          --checkpoint data/steam_followers_checkpoint.json
          --checkpoint-branch steam-state
          --checkpoint-every 5
          --max-fresh-requests 50
          --state data/steam_initial_state.json
          --master data/steam_upcoming_master.json
          --output output/steam_upcoming.json

      - name: Validate JSON
        run: |
          python -m json.tool output/steam_upcoming.json > /dev/null
          python -m json.tool data/steam_initial_state.json > /dev/null
          python -m json.tool data/steam_upcoming_master.json > /dev/null
          python -m json.tool data/steam_followers_cache.json > /dev/null

      - name: Show collection summary
        run: |
          python - <<'PY'
          import json
          import os

          with open("output/steam_upcoming.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          init = data.get("initialization", {})
          latest = data.get("latest_collection", {})
          last_attempt = init.get("last_attempt") or {}
          summary = (
              f"## Steam update\n\n"
              f"- Generated: {data.get('generated_at')}\n"
              f"- Mode: {init.get('mode')}\n"
              f"- Initial complete: {init.get('complete')}\n"
              f"- Next segment: {init.get('next_segment')} / {init.get('total_segments')}\n"
              f"- Last segment status: {last_attempt.get('status')}\n"
              f"- Public games >= 5000 followers: {data.get('count')}\n"
              f"- Fresh follower requests: {latest.get('fresh_follower_requests', 0)}\n"
              f"- Reused from private cache: {latest.get('cached_follower_reuses', 0)}\n"
              f"- Follower failures: {latest.get('follower_failures', 0)}\n"
              f"- Follower 429 events: {latest.get('follower_rate_limit_events', 0)}\n"
              f"- First follower 429 after fresh requests: {latest.get('first_follower_429_after_requests')}\n"
              f"- Checkpoint: every {latest.get('checkpoint_every', 5)} fresh lookups -> {latest.get('checkpoint_branch', 'steam-state')}\n"
          )

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write(summary)
          PY

      - name: Upload private JSON artifact
        uses: actions/upload-artifact@v4
        with:
          name: steam-upcoming-json
          path: output/steam_upcoming.json
          if-no-files-found: error
          retention-days: 7

      - name: Persist private Steam state and cache
        run: |
          for file in             data/steam_followers_cache.json             data/steam_initial_state.json             data/steam_upcoming_master.json
          do
            if [ ! -f "$file" ]; then
              echo "Missing private Steam state file: $file"
              exit 1
            fi
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             data/steam_followers_cache.json             data/steam_initial_state.json             data/steam_upcoming_master.json

          if git diff --cached --quiet; then
            echo "Private Steam state is already up to date."
          else
            git commit -m "data: update private Steam initialization state"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Publish JSON to public frontend repository
        env:
          FRONTEND_REPO_TOKEN: ${{ secrets.FRONTEND_REPO_TOKEN }}
        run: |
          if [ -z "$FRONTEND_REPO_TOKEN" ]; then
            echo "FRONTEND_REPO_TOKEN is not configured; skipping public publish."
            echo "Steam collection still completed successfully."
            exit 0
          fi

          git clone --depth 1 https://github.com/danielet087/game-trend-radar.git frontend
          mkdir -p frontend/data
          cp output/steam_upcoming.json frontend/data/steam_upcoming.json

          cd frontend
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/steam_upcoming.json

          if git diff --cached --quiet; then
            echo "Public Steam JSON is already up to date."
            exit 0
          fi

          git commit -m "data: update Steam upcoming games"
          # Keep origin URL clean; authenticate each network operation without saving the PAT.
          bash ../scripts/git_frontend_auth.sh push origin main
