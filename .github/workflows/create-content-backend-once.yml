name: Create content enrichment backend once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/create-content-backend-once.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create private content backend repository if missing
        env:
          GH_TOKEN: ${{ secrets.FRONTEND_REPO_TOKEN }}
          OWNER: danielet087
          TARGET_REPO: game-trend-radar-content-backend
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::FRONTEND_REPO_TOKEN is missing"
            exit 1
          fi
          if gh api "repos/$OWNER/$TARGET_REPO" >/dev/null 2>&1; then
            echo "TARGET_REPO_ALREADY_EXISTS"
            exit 0
          fi
          gh api --method POST user/repos \
            -f name="$TARGET_REPO" \
            -f description="Event-driven Steam content enrichment backend for Game Trend Radar" \
            -F private=true \
            -F auto_init=true \
            >/tmp/create.json
          python - <<'PY'
          import json
          d=json.load(open("/tmp/create.json",encoding="utf-8"))
          print("CREATED",d.get("full_name"),"private=",d.get("private"),"default_branch=",d.get("default_branch"))
          PY
