name: Credential expiry check
run-name: "Credential expiry check | slot=${{ inputs.target_slot || 'manual' }} | source=${{ inputs.trigger_source || github.event_name }}"

# Records only the expiry date and validity of each credential this repository's
# pipeline uses (never the values) on the radar-notification-state branch. The
# radar watchdog opens an issue 14 days before one expires or when one stops
# working. The Cloudflare scheduler dispatches this daily; GitHub's own
# (best-effort) schedule is a fallback.
on:
  schedule:
    - cron: '41 21 * * *'
  workflow_dispatch:
    inputs:
      target_slot:
        description: External scheduler slot identifier (leave empty for a manual run)
        required: false
        type: string
        default: ''
      trigger_source:
        description: Trigger source for run identification
        required: false
        type: string
        default: manual

permissions:
  contents: write

concurrency:
  group: credential-expiry
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check credential expiry
        uses: danielet087/game-trend-radar-backend/.github/actions/credential-expiry@e743210a045e1d1603b381e0476e9a6369972bf1
        env:
          FRONTEND_REPO_TOKEN: ${{ secrets.FRONTEND_REPO_TOKEN }}
          CONTENT_BACKEND_TOKEN: ${{ secrets.CONTENT_BACKEND_TOKEN }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        with:
          credentials: |
            github FRONTEND_REPO_TOKEN
            github CONTENT_BACKEND_TOKEN
            turso TURSO_AUTH_TOKEN
            cloudflare CLOUDFLARE_D1_API_TOKEN
