name: Update Steam upcoming data

on:
  workflow_dispatch:
  push:
    # Workflow changes are automatically verified once.
    branches:
      - main
    paths:
      - ".github/workflows/update-steam.yml"
  schedule:
    # 03:23 UTC = 11:23 Taiwan (UTC+8)
    - cron: "23 3 * * *"

permissions:
  contents: write

concurrency:
  group: steam-upcoming-daily
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout backend
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Collect Steam upcoming games slowly
        run: >
          python -m scripts.update_steam
          --country TW
          --days 365
          --min-followers 5000
          --request-interval 12
          --search-interval 10
          --max-pages 100
          --follower-cache data/steam_followers_cache.json
          --output output/steam_upcoming.json

      - name: Validate JSON
        run: |
          python -m json.tool output/steam_upcoming.json > /dev/null
          python - <<'PY'
          import json

          with open("output/steam_upcoming.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          if data.get("candidate_count", 0) <= 0:
              raise SystemExit("Steam candidate_count is 0; refusing to publish an empty dataset.")
          PY

      - name: Show collection summary
        run: |
          python - <<'PY'
          import json
          import os

          with open("output/steam_upcoming.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          collection = data.get("collection", {})
          summary = (
              f"## Steam update\n\n"
              f"- Generated: {data.get('generated_at')}\n"
              f"- Candidates: {data.get('candidate_count')}\n"
              f"- Followers >= {data.get('filter', {}).get('min_followers')}: {data.get('count')}\n"
              f"- Fresh follower requests: {collection.get('fresh_follower_requests', 0)}\n"
              f"- Reused from private cache: {collection.get('cached_follower_reuses', 0)}\n"
          )

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write(summary)
          PY

      - name: Upload private JSON artifact
        uses: actions/upload-artifact@v4
        with:
          name: steam-upcoming-json
          path: output/steam_upcoming.json
          if-no-files-found: error
          retention-days: 7

      - name: Persist private follower cache
        run: |
          if [ ! -f data/steam_followers_cache.json ]; then
            echo "Follower cache was not created."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/steam_followers_cache.json

          if git diff --cached --quiet; then
            echo "Private follower cache is already up to date."
          else
            git commit -m "data: update private Steam follower cache"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Publish JSON to public frontend repository
        env:
          FRONTEND_REPO_TOKEN: ${{ secrets.FRONTEND_REPO_TOKEN }}
        run: |
          if [ -z "$FRONTEND_REPO_TOKEN" ]; then
            echo "FRONTEND_REPO_TOKEN is not configured; skipping public publish."
            echo "Steam collection still completed successfully."
            exit 0
          fi

          git clone --depth 1 https://github.com/danielet087/game-trend-radar.git frontend
          mkdir -p frontend/data
          cp output/steam_upcoming.json frontend/data/steam_upcoming.json

          cd frontend
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/steam_upcoming.json

          if git diff --cached --quiet; then
            echo "Public Steam JSON is already up to date."
            exit 0
          fi

          git commit -m "data: update Steam upcoming games"
          git remote set-url origin "https://x-access-token:${FRONTEND_REPO_TOKEN}@github.com/danielet087/game-trend-radar.git"
          git push origin main
