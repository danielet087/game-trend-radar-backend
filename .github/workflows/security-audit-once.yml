name: Security audit - historical Git objects and tests

# One-time post-fix verification; restore manual-only after checking the result.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/security-audit-once.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout all reachable Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Confirm full clone includes main and steam-state
        run: |
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --tags --prune
          git branch --remotes
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Scan Git objects without printing secret values
        run: python -m scripts.security_audit_history
      - name: Install test dependencies
        if: always()
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Run all regression and credential-redaction tests
        if: always()
        run: python -m pytest -q
