name: Update Steam upcoming data

on:
  workflow_dispatch:
  schedule:
    # 03:23 UTC = 11:23 Taiwan (UTC+8)
    - cron: "23 3 * * *"

permissions:
  contents: read

concurrency:
  group: steam-upcoming-daily
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout backend
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Collect Steam upcoming games
        run: |
          python -m scripts.update_steam             --country TW             --days 365             --min-followers 5000             --output output/steam_upcoming.json

      - name: Validate JSON
        run: python -m json.tool output/steam_upcoming.json > /dev/null

      - name: Show collection summary
        run: |
          python - <<'PY'
          import json
          import os

          with open("output/steam_upcoming.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          summary = (
              f"## Steam update\n\n"
              f"- Generated: {data.get('generated_at')}\n"
              f"- Candidates checked: {data.get('candidate_count')}\n"
              f"- Followers >= {data.get('filter', {}).get('min_followers')}: {data.get('count')}\n"
          )

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write(summary)
          PY

      - name: Upload private JSON artifact
        uses: actions/upload-artifact@v4
        with:
          name: steam-upcoming-json
          path: output/steam_upcoming.json
          if-no-files-found: error
          retention-days: 7
