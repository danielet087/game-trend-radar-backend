name: Steam Community egress probe
run-name: "Steam Community egress probe | ${{ inputs.mode || 'cached' }} | ${{ github.event_name }}"

# Read-only diagnosis of the official Followers 429s: six spaced requests from
# one GitHub runner, compared with a Store API control. No secrets, no state.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "cached: fixed URLs; uncached: three queued groups the edge cache cannot answer"
        required: false
        type: choice
        options: [cached, uncached]
        default: cached
      spacing_seconds:
        required: false
        type: number
        default: 20
      count:
        description: "uncached mode: number of groups (3 compares user agents; other values repeat production)"
        required: false
        type: number
        default: 3
      accept_language:
        description: "Accept-Language header, or none to send production's exact headers"
        required: false
        type: string
        default: en-US
      queue_offset:
        description: "uncached mode: first queue position to sample (use different values for parallel probes)"
        required: false
        type: number
        default: 100

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'requests>=2.32,<3'
      - name: Probe from this runner
        env:
          PROBE_MODE: ${{ inputs.mode || 'cached' }}
          PROBE_SPACING_SECONDS: ${{ inputs.spacing_seconds || 20 }}
          PROBE_QUEUE_OFFSET: ${{ inputs.queue_offset || 100 }}
          PROBE_COUNT: ${{ inputs.count || 3 }}
          PROBE_ACCEPT_LANGUAGE: ${{ inputs.accept_language || 'en-US' }}
        run: |
          echo "Runner egress: $(curl -fsS --max-time 10 https://api.ipify.org || echo unknown)"
          python -m scripts.probe_steam_community_egress
