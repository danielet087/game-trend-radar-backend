name: One-time verify Steam TW title routing

# Regression launched once; manual-only now.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Check date gate, TW names and full follower routing
        run: >
          python -m pytest -q
          tests/test_steam_localized_titles.py
          tests/test_steam_candidate_pipeline.py
          tests/test_steam_candidate_date_gate.py
          tests/test_steam_follower_prefilter.py
          tests/test_steam_candidate_supervisor.py
