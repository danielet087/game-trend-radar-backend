name: Experiment - verify fresh 4000 shortlist against official Steam Followers

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/steam-official-followers-verify-fresh-once.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: isolated-fresh-official-followers-verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout verification script only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/experiment_verify_official_followers_fresh.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download fresh third-party 4000 shortlist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf input
          mkdir -p input
          gh run download 35702182234             --repo "${GITHUB_REPOSITORY}"             --name steam-followers-prefilter-fresh             --dir input
          test -s input/third_party_4000_priority.json
          python - <<'PY'
          import json
          p="input/third_party_4000_priority.json"
          d=json.load(open(p,encoding="utf-8"))
          assert len(d)==92, len(d)
          assert len({int(x["appid"]) for x in d})==92
          assert all(int(x["third_party_followers"])>=4000 for x in d)
          print("Fresh third-party priority input:",len(d))
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Verify actual Steam Community follower counts
        run: >
          python -u scripts/experiment_verify_official_followers_fresh.py
          --input input/third_party_4000_priority.json
          --out output/steam_official_followers_verify
          --threshold 5000
          --start-interval 8

      - name: Upload official verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: steam-official-followers-verify-fresh
          path: output/steam_official_followers_verify/
          if-no-files-found: warn
          retention-days: 7
