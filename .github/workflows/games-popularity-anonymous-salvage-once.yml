name: Experiment - bounded anonymous Games Popularity salvage

# Single manual/push pilot of <=60 anonymous requests. No schedule.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/games-popularity-anonymous-salvage-once.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: isolated-games-popularity-checkpoint-20260922
  cancel-in-progress: false

jobs:
  salvage:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout experimental scanner and persistent checkpoint only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/experiment_games_popularity_resumable.py
            experiments/games_popularity_20260922/
          sparse-checkout-cone-mode: false

      - name: Download the frozen fresh candidate cohort
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input
          gh run download 35702182234 --repo "${GITHUB_REPOSITORY}" --name steam-followers-prefilter-fresh --dir input
          test -s input/third_party_unresolved.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests and check syntax
        run: |
          python -m pip install --disable-pip-version-check requests
          python -m py_compile scripts/experiment_games_popularity_resumable.py

      - name: Use public anonymous quota carefully, max sixty requests
        run: >
          python -u scripts/experiment_games_popularity_resumable.py
          --anonymous
          --priority input/third_party_4000_priority.json
          --below input/third_party_below_4000.json
          --unresolved input/third_party_unresolved.json
          --checkpoint experiments/games_popularity_20260922/checkpoint.json
          --out output/games_popularity_anonymous_salvage
          --workers 2
          --batch-size 10
          --max-new 60
          --max-minutes 5

      - name: Persist independent follower checkpoint
        if: always()
        run: |
          if [ -s experiments/games_popularity_20260922/checkpoint.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add experiments/games_popularity_20260922/checkpoint.json
            if ! git diff --cached --quiet; then
              git commit -m "experiment: salvage anonymous follower observations"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi

      - name: Upload salvage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: games-popularity-anonymous-salvage
          path: output/games_popularity_anonymous_salvage/
          retention-days: 30
          if-no-files-found: warn
