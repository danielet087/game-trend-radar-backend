name: Probe Steam clan diagnostics (read-only)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-steam-clan-diagnostics.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: steam-clan-diagnostics
  cancel-in-progress: false

jobs:
  probe:
    # One-off bounded diagnostic independent of the offline self-hosted runner.
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout private backend
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install probe dependencies only
        run: python -m pip install --disable-pip-version-check requests "steam[client]==1.4.4"
      - name: Diagnose key-only metadata and anonymous Steam CM responses
        env:
          STEAM_WEB_API_KEY: ${{ secrets.STEAM_WEB_API_KEY }}
        run: python -m scripts.probe_steam_clan_diagnostics
      - name: Validate private report
        if: always()
        run: |
          if [ -f output/steam_clan_diagnostics.json ]; then
            python -m json.tool output/steam_clan_diagnostics.json > /dev/null
          fi
      - name: Upload short-lived private report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: steam-clan-diagnostics
          path: output/steam_clan_diagnostics.json
          if-no-files-found: ignore
          retention-days: 1
