name: Steam candidates then Followers
run-name: "Steam daily discovery | slot=${{ inputs.target_slot || 'manual' }} | source=${{ inputs.trigger_source || github.event_name }}"

on:
  # Taiwan 00:00/06:00/12:00/18:00 recovery checks: rebuild the rolling 365-day candidate set,
  # verify exact Store date + non-adult eligibility, then finish third-party
  # Followers prescreen. Official XML verification is handed to the separate
  # 03:00-23:00 hourly catch-up workflow.
  workflow_dispatch:
    inputs:
      trigger_source:
        description: Trigger origin; Cloudflare requires a daily UTC target_slot
        required: false
        default: manual
        type: choice
        options: [manual, cloudflare]
      target_slot:
        description: Original Taiwan 00:00/06:00/12:00/18:00 check as an ISO UTC timestamp
        required: false
        default: ""
        type: string
      refresh_today:
        description: "Run the full daily discovery and prescreen to recover a missed refresh"
        required: false
        default: false
        type: boolean
permissions:
  contents: write
concurrency:
  group: steam-two-phase-initialization
  cancel-in-progress: false
jobs:
  batch:
    # Ephemeral GitHub-hosted runner: safe default before making this repo public.
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout backend
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-core.txt
            requirements-dev.txt
      - name: Install dependencies
        id: install
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Validate external daily slot before resetting discovery
        id: schedule_guard
        env:
          SCHEDULE_EVENT: ${{ github.event_name }}
          SCHEDULE_TRIGGER_SOURCE: ${{ inputs.trigger_source }}
          SCHEDULE_TARGET_SLOT: ${{ inputs.target_slot }}
          SCHEDULE_REFRESH_TODAY: ${{ inputs.refresh_today }}
        run: python -m scripts.external_schedule --workflow daily-discovery --fail-on-skip
      - name: Run tests
        run: python -m pytest -q

      - name: Persist daily reset once, or resume the existing scheduled slot
        id: daily_reset
        if: github.event_name == 'schedule' || inputs.refresh_today == true
        env:
          SCHEDULE_EVENT: ${{ github.event_name }}
          SCHEDULE_TRIGGER_SOURCE: ${{ inputs.trigger_source }}
          SCHEDULE_TARGET_SLOT: ${{ inputs.target_slot }}
          SCHEDULE_REFRESH_TODAY: ${{ inputs.refresh_today }}
        run: |
          python -m radar_backend.jobs.persist_daily_state reset \
            --receipt output/daily-reset-publication.json
      - name: Capture private state before collection changes it
        id: private_baseline
        run: |
          python -m radar_backend.jobs.persist_daily_state capture \
            --output output/daily-state-baseline.json
      - name: Daily discovery or recovery through complete third-party prescreen
        if: github.event_name == 'schedule' || inputs.refresh_today == true
        env:
          STEAM_WEB_API_KEY: ${{ secrets.STEAM_WEB_API_KEY }}
          STEAM_CHECKPOINT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for n in {1..40}; do
            phase="$(python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("data/steam_candidate_state.json").read_text(encoding="utf-8"))
          print(d.get("phase",""))
          PY
          )"
            echo "DAILY_STEAM_REFRESH phase=$phase pass=$n"
            if [ "$phase" = "followers" ] || [ "$phase" = "complete" ]; then
              break
            fi
            python -m scripts.steam_candidate_pipeline               --days 365               --batch-days 365               --request-interval 30               --search-interval 1.5               --state data/steam_candidate_state.json               --catalog data/steam_candidates.json               --master data/steam_upcoming_master.json               --follower-cache data/steam_followers_cache.json               --checkpoint data/steam_followers_checkpoint.json               --checkpoint-branch steam-state               --prefilter-state data/steam_prefilter_state.json               --prefilter-batch-size 200               --prefilter-request-interval 0.5               --output output/steam_upcoming.json
          done
          python - <<'PY'
          import json
          from pathlib import Path
          state=json.loads(Path("data/steam_candidate_state.json").read_text(encoding="utf-8"))
          pre=json.loads(Path("data/steam_prefilter_state.json").read_text(encoding="utf-8"))
          if state.get("phase") not in {"followers","complete"}:
              raise SystemExit(f"Daily refresh did not reach Followers handoff: {state.get('phase')}")
          if not pre.get("complete"):
              raise SystemExit("Daily third-party prescreen incomplete")
          print("DAILY_STEAM_REFRESH_READY_FOR_0300",
                "eligible=",state.get("date_precision_eligible_count"),
                "prefilter_screened=",state.get("prefilter_screened_count"))
          PY

      - name: Manual continuation of Steam two-phase pipeline
        if: github.event_name == 'workflow_dispatch' && inputs.refresh_today != true
        env:
          STEAM_WEB_API_KEY: ${{ secrets.STEAM_WEB_API_KEY }}
          STEAM_CHECKPOINT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          python -m scripts.steam_candidate_pipeline
          --days 365
          --batch-days 365
          --request-interval 30
          --search-interval 1.5
          --state data/steam_candidate_state.json
          --catalog data/steam_candidates.json
          --master data/steam_upcoming_master.json
          --follower-cache data/steam_followers_cache.json
          --checkpoint data/steam_followers_checkpoint.json
          --checkpoint-branch steam-state
          --prefilter-state data/steam_prefilter_state.json
          --prefilter-batch-size 200
          --prefilter-request-interval 0.5
          --output output/steam_upcoming.json

      - name: Export today's exact-date non-adult candidate handoff
        if: github.event_name == 'schedule' || inputs.refresh_today == true
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          from scripts.update_steam_daily import save_json

          catalog=json.loads(Path("data/steam_candidates.json").read_text(encoding="utf-8"))
          rows=catalog.get("date_precision_eligible") or []
          if not catalog.get("date_precision_complete") or not rows:
              raise SystemExit("Exact-date/non-adult eligible catalogue missing")
          if not all(
              row.get("release_precision") == "day"
              and row.get("release_display_precision") == "date_full"
              and row.get("sexual_content_screened") is True
              for row in rows
          ):
              raise SystemExit("Eligible handoff contains an invalid date/adult gate row")
          save_json(Path("data/steam_candidates_eligible.json"), {
              "version": 1,
              "screened_at": datetime.now(timezone.utc).isoformat(),
              "count": len(rows),
              "games": rows,
          })
          print("DAILY_ELIGIBLE_HANDOFF_WRITTEN", len(rows))
          PY
      - name: Validate persistent candidate and state JSON
        run: |
          python -m json.tool data/steam_candidate_state.json > /dev/null
          python -m json.tool data/steam_candidates.json > /dev/null
          if [ -f output/steam_upcoming.json ]; then
            python -m json.tool output/steam_upcoming.json > /dev/null
          fi
      - name: Validate strict three-stage results before public update
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.twitch_steam_admission import is_twitch_qualified

          state = json.loads(Path("data/steam_candidate_state.json").read_text(encoding="utf-8"))
          attempt = state.get("last_attempt") or {}
          if attempt.get("phase") == "prefilter":
              assert int(attempt.get("fresh_follower_requests", -1)) == 0, (
                  "Stage 2 must NEVER query Steam XML"
              )
              assert 0 <= int(state["prefilter_next_index"]) <= int(attempt["candidate_count"])
              payload = json.loads(Path("output/steam_upcoming.json").read_text(encoding="utf-8"))
              assert payload["initialization"]["prefilter_next_index"] == state["prefilter_next_index"]
              assert all(int(g["followers"]) >= 5000 or is_twitch_qualified(g) for g in payload["games"])
              print(f"Third-party >=4000 prescreen: {state['prefilter_screened_count']} "
                    f"/{attempt['candidate_count']}; Steam XML queries: 0")
          elif attempt.get("phase") == "followers":
              n = int(attempt.get("fresh_follower_requests", -1))
              assert 0 <= n <= 50, f"Unexpected fresh Followers requests: {n}"
              start, end = int(attempt["start_index"]), int(attempt["next_index"])
              assert end > start or state.get("initial_complete"), (
                  "No new verified priority games or completion"
              )
              payload = json.loads(Path("output/steam_upcoming.json").read_text(encoding="utf-8"))
              assert payload["initialization"]["prefilter_complete"] is True
              assert payload["initialization"]["verified_priority_count"] == end
              assert payload["initialization"]["days_scanned"] == 365
              assert payload["count"] == len(payload["games"])
              assert all(int(g["followers"]) >= 5000 or is_twitch_qualified(g) for g in payload["games"])
              print(f"Steam XML verification: {n} new, shortlisted {start}->{end}; "
                    f"officially qualified {payload['count']}")
          else:
              print("Steam discovery/initialization completion; no new XML batch.")

          PY
      - name: Save private candidate catalog and checkpoint metadata
        if: always() && steps.schedule_guard.outcome == 'success' && steps.install.outcome == 'success' && steps.private_baseline.outcome == 'success'
        run: |
          python -m radar_backend.jobs.persist_daily_state publish \
            --baseline output/daily-state-baseline.json \
            --receipt output/daily-state-publication.json
      - name: Keep daily state publication evidence and frozen recovery input
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: steam-daily-state-publication
          path: |
            output/daily-reset-publication.json
            output/daily-state-baseline.json
            output/daily-state-pending.json
            output/daily-state-publication.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Publish updated site JSON after EVERY Followers batch
        if: ${{ success() }}
        env:
          FRONTEND_REPO_TOKEN: ${{ secrets.FRONTEND_REPO_TOKEN }}
        run: |
          if [ -f output/steam_upcoming.json ]; then
            git clone --depth 1 https://github.com/danielet087/game-trend-radar.git frontend
          fi
          python -m radar_backend.jobs.publish_steam catalog \
            --skip-missing-batch output/steam_upcoming.json \
            --receipt output/steam-catalog-publication.json
      - name: Keep acknowledged Steam publication revision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: steam-catalog-publication
          path: output/steam-catalog-publication.json
          if-no-files-found: ignore
          retention-days: 7
