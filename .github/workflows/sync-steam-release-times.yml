name: Sync public Steam release timestamps

# Paused by request: automatic workflow triggers disabled.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: steam-public-date-sync
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout private backend
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install requests and parser
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Clone frontend
        run: git clone --depth 1 https://github.com/danielet087/game-trend-radar.git frontend
      - name: Fetch public TW release times and update JSON
        run: >
          python -m scripts.sync_public_release_dates
          --frontend-data frontend/data
      - name: Validate Steam JSON
        run: |
          python -m json.tool frontend/data/steam_preview.json > /dev/null
          python -m json.tool frontend/data/steam_upcoming.json > /dev/null
      - name: Publish corrected release dates
        env:
          FRONTEND_REPO_TOKEN: ${{ secrets.FRONTEND_REPO_TOKEN }}
        run: |
          if [ -z "$FRONTEND_REPO_TOKEN" ]; then
            echo "::error::FRONTEND_REPO_TOKEN is missing"
            exit 1
          fi
          cd frontend
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/steam_preview.json data/steam_upcoming.json
          if git diff --cached --quiet; then
            echo "No new release metadata"
            exit 0
          fi
          git commit -m "data: sync public TW release timestamps without refetching followers"
          git remote set-url origin "https://x-access-token:${FRONTEND_REPO_TOKEN}@github.com/danielet087/game-trend-radar.git"
          git pull --rebase origin main
          git push origin HEAD:main
