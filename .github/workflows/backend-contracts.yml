name: Verify backend contracts without collection

on:
  pull_request:
    paths:
      - "scripts/**"
      - "radar_backend/**"
      - "collectors/**"
      - "tests/**"
      - "requirements*.txt"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Run offline regression tests
        run: python -m pytest -q
