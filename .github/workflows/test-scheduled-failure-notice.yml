name: Verify scheduled notification threshold
on:
  pull_request:
    paths: ['.github/actions/scheduled-failure-notice/**', '.github/actions/credential-expiry/**', '.github/workflows/**']
  push:
    branches: [main]
    paths: ['.github/actions/scheduled-failure-notice/**', '.github/actions/credential-expiry/**', '.github/workflows/test-scheduled-failure-notice.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node --test .github/actions/scheduled-failure-notice/index.test.cjs .github/actions/credential-expiry/index.test.cjs
