name: Coordinate database primary cutover

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [prepare, cutover, resume]
        default: prepare
  push:
    branches: [main]
    paths: [config/database-rollout.json, .github/workflows/database-primary-control.yml]

permissions:
  contents: read
  actions: write

concurrency:
  group: radar-database-cutover
  cancel-in-progress: false

jobs:
  coordinate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Stop the obsolete experiment triggered by the initial migration commit
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess
          repo = 'danielet087/game-trend-radar-backend'
          run_id = 38761923739
          result = subprocess.run(['gh', 'api', f'repos/{repo}/actions/runs/{run_id}'],
                                  check=True, capture_output=True, text=True)
          run = json.loads(result.stdout)
          expected = ('c894f89715100c233d01a9d76d293d84f304fe89', 'push',
                      '.github/workflows/steam-official-hour-stress-once.yml')
          if (run.get('head_sha'), run.get('event'), run.get('path')) != expected:
              raise SystemExit('Unexpected historical run identity; no cancellation performed')
          if run.get('status') != 'completed':
              subprocess.run(['gh', 'api', '--method', 'POST',
                              f'repos/{repo}/actions/runs/{run_id}/cancel'], check=True)
              print('Requested cancellation of the obsolete one-off experiment')
          else:
              print('The obsolete one-off experiment is already stopped')
          PY
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the checked-out core and sealed-box encryption
        run: python -m pip install --disable-pip-version-check ./packages/radar-core 'PyNaCl>=1.6,<2'
      - name: Prepare credentials or perform the reviewed cutover
        env:
          DATABASE_ROLLOUT_TOKEN: ${{ secrets.DATABASE_ROLLOUT_TOKEN }}
          FRONTEND_REPO_TOKEN: ${{ secrets.FRONTEND_REPO_TOKEN }}
          CONTENT_BACKEND_TOKEN: ${{ secrets.CONTENT_BACKEND_TOKEN }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          REQUESTED_MODE: ${{ inputs.mode }}
        run: python -u -m scripts.database_primary_control --report "$RUNNER_TEMP/database-cutover.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: database-primary-cutover
          path: ${{ runner.temp }}/database-cutover.json
          retention-days: 7
          if-no-files-found: warn
