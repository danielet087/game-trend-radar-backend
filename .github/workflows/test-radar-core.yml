name: Validate shared radar core

on:
  pull_request:
    paths: ['packages/radar-core/**', '.github/workflows/test-radar-core.yml']
  push:
    branches: [main]
    paths: ['packages/radar-core/**', '.github/workflows/test-radar-core.yml']

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ./packages/radar-core
      - run: python -m unittest discover -s packages/radar-core/tests -v
