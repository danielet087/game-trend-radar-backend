name: Update Twitch live data

on:
  workflow_dispatch:
  schedule:
    # 每小時第 37 分執行，避開整點常見的排程尖峰
    - cron: "37 * * * *"

permissions:
  contents: read

concurrency:
  group: twitch-live-hourly
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout backend
        uses: actions/checkout@v4

      - name: Check Twitch credentials
        id: credentials
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: |
          if [ -n "$TWITCH_CLIENT_ID" ] && [ -n "$TWITCH_CLIENT_SECRET" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Twitch credentials are not configured yet; skipping this hourly run."
          fi

      - name: Set up Python
        if: steps.credentials.outputs.configured == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        if: steps.credentials.outputs.configured == 'true'
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run tests
        if: steps.credentials.outputs.configured == 'true'
        run: python -m pytest -q

      - name: Collect Twitch data
        if: steps.credentials.outputs.configured == 'true'
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: >
          python -m scripts.update_twitch
          --global-pages 10
          --tracked-pages 50
          --top-games 100
          --output output/twitch_live.json

      - name: Validate Twitch JSON
        if: steps.credentials.outputs.configured == 'true'
        run: python -m json.tool output/twitch_live.json > /dev/null

      - name: Upload private Twitch artifact
        if: steps.credentials.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: twitch-live-json
          path: output/twitch_live.json
          if-no-files-found: error
          retention-days: 2

      - name: Publish Twitch JSON to public frontend repository
        if: steps.credentials.outputs.configured == 'true'
        env:
          FRONTEND_REPO_TOKEN: ${{ secrets.FRONTEND_REPO_TOKEN }}
        run: |
          if [ -z "$FRONTEND_REPO_TOKEN" ]; then
            echo "FRONTEND_REPO_TOKEN is not configured; skipping public publish."
            exit 0
          fi

          git clone --depth 1 https://github.com/danielet087/game-trend-radar.git frontend
          mkdir -p frontend/data
          cp output/twitch_live.json frontend/data/twitch_live.json

          cd frontend
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/twitch_live.json

          if git diff --cached --quiet; then
            echo "Public Twitch JSON is already up to date."
            exit 0
          fi

          git commit -m "data: update Twitch live metrics"
          git remote set-url origin "https://x-access-token:${FRONTEND_REPO_TOKEN}@github.com/danielet087/game-trend-radar.git"
          git push origin main
