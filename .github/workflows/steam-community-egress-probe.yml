name: Steam Community egress probe
run-name: "Steam Community egress probe | ${{ github.event_name }}"

# Read-only diagnosis of the official Followers 429s: six spaced requests from
# one GitHub runner, compared with a Store API control. No secrets, no state.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'requests>=2.32,<3'
      - name: Probe from this runner
        run: |
          echo "Runner egress: $(curl -fsS --max-time 10 https://api.ipify.org || echo unknown)"
          python -m scripts.probe_steam_community_egress
