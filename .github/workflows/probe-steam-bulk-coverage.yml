name: Probe 60 Steam group mappings and bulk coverage

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-steam-bulk-coverage.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout read-only backend
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requests
        run: python -m pip install --disable-pip-version-check requests
      - name: Read-only stratified 60 AppID mapping and bulk match
        env:
          STEAM_WEB_API_KEY: ${{ secrets.STEAM_WEB_API_KEY }}
        run: python -m scripts.probe_steam_bulk_coverage
      - name: Validate private result
        if: always()
        run: |
          if [ -f output/steam_bulk_coverage_probe.json ]; then
            python -m json.tool output/steam_bulk_coverage_probe.json > /dev/null
          fi
      - name: Save private benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: steam-bulk-coverage-probe
          path: output/steam_bulk_coverage_probe.json
          if-no-files-found: ignore
          retention-days: 1
